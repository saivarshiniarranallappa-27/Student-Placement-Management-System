<!DOCTYPE html>
<html>
<head>

    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">

        <span class="navbar-brand">
            Student Placement System
        </span>

        <div>

            <a href="/my-applications"
               class="btn btn-warning">
               My Applications
            </a>

            <a href="/logout"
               class="btn btn-danger">
               Logout
            </a>

        </div>

    </nav>

    <!-- Main Container -->
    <div class="container mt-4">

        <h2 class="mb-4">
            Welcome {{ name }}
        </h2>

        <!-- Search -->
        <form method="GET" class="mb-4">

            <div class="row">

                <div class="col-md-10">

                    <input type="text"
                           name="search"
                           class="form-control"
                           placeholder="Search company or role">

                </div>

                <div class="col-md-2">

                    <button type="submit"
                            class="btn btn-primary w-100">
                            Search
                    </button>

                </div>

            </div>

        </form>

        <!-- Company Cards -->
        <div class="row">

            {% for company in companies %}

            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h4 class="card-title">
                            {{ company[1] }}
                        </h4>

                        <p>
                            <b>Role:</b>
                            {{ company[2] }}
                        </p>

                        <p>
                            <b>Package:</b>
                            {{ company[3] }}
                        </p>

                        <a href="/apply/{{ company[1] }}"
                           class="btn btn-success">
                           Apply
                        </a>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
