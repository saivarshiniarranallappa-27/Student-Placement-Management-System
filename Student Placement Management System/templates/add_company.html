<!DOCTYPE html>
<html>
<head>

    <title>Add Company</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <div class="logo">
            Add Company
        </div>

        <div class="menu">

            <a href="/admin-dashboard">
                Dashboard
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </div>

    <!-- Form -->
    <div class="form-container">

        <h1>Add New Company</h1>

        <form method="POST">

            <input type="text"
                   name="company_name"
                   placeholder="Company Name"
                   required>

            <input type="text"
                   name="role"
                   placeholder="Job Role"
                   required>

            <input type="text"
                   name="package"
                   placeholder="Package"
                   required>

            <button type="submit">
                Add Company
            </button>

        </form>

    </div>

</body>
</html>
